<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f4ef" />
  <title>Task List — Task Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Task List">
        <span class="brand-mark">tl</span>
        <span>Task List</span>
      </a>
      <section class="important-note" id="importantNote" aria-label="Important note"></section>
      <nav class="sort-controls" aria-label="Sort cards">
        <button class="sort-button" type="button" data-sort="priority">Priority <span class="sort-direction" aria-hidden="true"></span></button>
        <button class="sort-button active" type="button" data-sort="tags" aria-pressed="true">Tags <span class="sort-direction" aria-hidden="true">↑</span></button>
        <button class="sort-button" type="button" data-sort="date">Date <span class="sort-direction" aria-hidden="true"></span></button>
      </nav>
    </header>

    <nav class="tag-filters" id="tagFilters" aria-label="Filter cards by tag" hidden></nav>

    <section class="board" aria-label="Cards">
      <div class="card-grid" id="cardGrid"></div>
    </section>
  </main>

  <template id="cardTemplate">
    <article class="task-card">
      <div class="card-topline">
        <div class="tag-list"></div>
        <span class="priority-badge"></span>
        <button class="delete-button" type="button" aria-label="Delete card" title="Delete card">×</button>
      </div>
      <div class="task-text"></div>
      <footer>
        <span class="created-at"></span>
        <button class="complete-button" type="button" aria-label="Mark as completed">✓</button>
      </footer>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
