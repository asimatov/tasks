<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f4ef" />
  <title>Task List — Task Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Task List">
        <span class="brand-mark">tl</span>
        <span>Task List</span>
      </a>
      <button class="primary-button" id="openCreateButton" type="button">
        <span aria-hidden="true">＋</span> New card
      </button>
    </header>

    <section class="board" aria-label="Cards">
      <div class="card-grid" id="cardGrid"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon" aria-hidden="true">✦</div>
        <h2>Nothing here yet</h2>
        <p>Create a card, choose a color and add tags — everything is saved in this browser.</p>
        <button class="text-button" id="emptyCreateButton" type="button">Create your first card →</button>
      </div>
    </section>
  </main>

  <dialog id="taskDialog">
    <form id="taskForm" method="dialog">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow" id="dialogEyebrow">New task</p>
          <h2 id="dialogTitle">Create a card</h2>
        </div>
        <button class="icon-button" id="closeDialogButton" type="button" aria-label="Close">×</button>
      </div>

      <label class="field">
        <span>What needs to be done?</span>
        <textarea id="taskText" rows="5" maxlength="500" placeholder="For example, prepare the presentation outline…" required></textarea>
        <small><span id="charCount">0</span>/500</small>
      </label>

      <fieldset class="field color-fieldset">
        <legend>Card color</legend>
        <div class="color-options" id="colorOptions">
          <label><input type="radio" name="color" value="sand" checked /><span class="swatch sand" title="Sand"></span></label>
          <label><input type="radio" name="color" value="coral" /><span class="swatch coral" title="Coral"></span></label>
          <label><input type="radio" name="color" value="sage" /><span class="swatch sage" title="Sage"></span></label>
          <label><input type="radio" name="color" value="sky" /><span class="swatch sky" title="Sky"></span></label>
          <label><input type="radio" name="color" value="lilac" /><span class="swatch lilac" title="Lilac"></span></label>
          <label><input type="radio" name="color" value="cream" /><span class="swatch cream" title="Cream"></span></label>
          <label><input type="radio" name="color" value="blush" /><span class="swatch blush" title="Blush"></span></label>
          <label><input type="radio" name="color" value="peach" /><span class="swatch peach" title="Peach"></span></label>
          <label><input type="radio" name="color" value="mint" /><span class="swatch mint" title="Mint"></span></label>
          <label><input type="radio" name="color" value="mist" /><span class="swatch mist" title="Mist"></span></label>
          <label><input type="radio" name="color" value="lavender" /><span class="swatch lavender" title="Lavender"></span></label>
          <label><input type="radio" name="color" value="stone" /><span class="swatch stone" title="Stone"></span></label>
        </div>
      </fieldset>

      <label class="field">
        <span>Tags</span>
        <input id="taskTags" type="text" maxlength="120" placeholder="work, personal, urgent" />
        <small>Separate tags with commas</small>
      </label>

      <div class="dialog-actions">
        <button class="secondary-button" id="cancelButton" type="button">Cancel</button>
        <button class="primary-button" type="submit">Save card</button>
      </div>
    </form>
  </dialog>

  <template id="cardTemplate">
    <article class="task-card">
      <div class="card-topline">
        <div class="tag-list"></div>
        <button class="delete-button" type="button" aria-label="Delete card" title="Delete card">×</button>
      </div>
      <div class="task-text"></div>
      <footer>
        <span class="created-at"></span>
        <button class="complete-button" type="button" aria-label="Mark as completed">✓</button>
      </footer>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
